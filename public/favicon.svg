<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(32,32)">
    <!-- 8 Blue-toned Flower Petals -->
    <path d="M 0,-4 C -6,-16 -6,-24 0,-28 C 6,-24 6,-16 0,-4 Z" fill="url(#petalGrad1)" opacity="0.95" filter="url(#glow)"/>
    <path d="M 0,-4 C -6,-16 -6,-24 0,-28 C 6,-24 6,-16 0,-4 Z" fill="url(#petalGrad2)" opacity="0.85" transform="rotate(45)"/>
    <path d="M 0,-4 C -6,-16 -6,-24 0,-28 C 6,-24 6,-16 0,-4 Z" fill="url(#petalGrad1)" opacity="0.95" transform="rotate(90)"/>
    <path d="M 0,-4 C -6,-16 -6,-24 0,-28 C 6,-24 6,-16 0,-4 Z" fill="url(#petalGrad2)" opacity="0.85" transform="rotate(135)"/>
    <path d="M 0,-4 C -6,-16 -6,-24 0,-28 C 6,-24 6,-16 0,-4 Z" fill="url(#petalGrad1)" opacity="0.95" transform="rotate(180)"/>
    <path d="M 0,-4 C -6,-16 -6,-24 0,-28 C 6,-24 6,-16 0,-4 Z" fill="url(#petalGrad2)" opacity="0.85" transform="rotate(225)"/>
    <path d="M 0,-4 C -6,-16 -6,-24 0,-28 C 6,-24 6,-16 0,-4 Z" fill="url(#petalGrad1)" opacity="0.95" transform="rotate(270)"/>
    <path d="M 0,-4 C -6,-16 -6,-24 0,-28 C 6,-24 6,-16 0,-4 Z" fill="url(#petalGrad2)" opacity="0.85" transform="rotate(315)"/>

    <!-- Central pistil ring & core -->
    <circle cx="0" cy="0" r="6.5" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="url(#centerGrad)"/>
  </g>
</svg>
